name: Android CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SHARE_BASE_URL: ${{ secrets.SHARE_BASE_URL }}
      DIAG_TOKEN: ${{ secrets.DIAG_TOKEN }}
      KEYSTORE_PATH: keystore.jks
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - name: Firebase config (optional, for push alerts)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then echo "$GOOGLE_SERVICES_JSON" | base64 -d > app/google-services.json; fi
      - name: Check release signing secrets
        env:
          KEYSTORE_B64_A: ${{ secrets.KEYSTORE_B64_A }}
          KEYSTORE_B64_B: ${{ secrets.KEYSTORE_B64_B }}
          KEYSTORE_B64_C: ${{ secrets.KEYSTORE_B64_C }}
          KEYSTORE_B64_D: ${{ secrets.KEYSTORE_B64_D }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for v in KEYSTORE_B64_A KEYSTORE_B64_B KEYSTORE_B64_C KEYSTORE_B64_D KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!v}" ]; then echo "Missing secret: $v"; exit 1; fi
          done
          echo "All release signing secrets present"
      - name: Decode release keystore
        env:
          KEYSTORE_B64_A: ${{ secrets.KEYSTORE_B64_A }}
          KEYSTORE_B64_B: ${{ secrets.KEYSTORE_B64_B }}
          KEYSTORE_B64_C: ${{ secrets.KEYSTORE_B64_C }}
          KEYSTORE_B64_D: ${{ secrets.KEYSTORE_B64_D }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          echo "${KEYSTORE_B64_A}${KEYSTORE_B64_B}${KEYSTORE_B64_C}${KEYSTORE_B64_D}" | base64 -d > app/keystore.jks
          ls -l app/keystore.jks
          keytool -list -keystore app/keystore.jks -storepass "$KEYSTORE_PASSWORD"
      - name: Build release APK
        run: gradle :app:assembleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: BikeGuard-apk
          path: app/build/outputs/apk/release/*.apk
      - name: Publish GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - name: Run unit tests and lint
        run: gradle :app:testDebugUnitTest :app:lintDebug --stacktrace

  sql-test:
    name: SQL tests (geofence + trips)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: bikeguard-test
          POSTGRES_DB: bikeguard_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s --health-timeout=5s --health-retries=10
    env:
      PGPASSWORD: bikeguard-test
      PGDATABASE: bikeguard_test
      PGHOST: localhost
      PGUSER: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Install psql client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Set up Supabase stubs (auth schema, roles, realtime publication)
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/ci-setup.sql
      - name: Apply migrations under test
        run: |
          for m in 0001_init 0002_trips 0003_security_and_sharing 0011_geofence_stale 0012_trips_stops; do
            psql -v ON_ERROR_STOP=1 -f supabase/migrations/$m.sql
          done
      - name: Run SQL tests
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/sql_tests.sql
