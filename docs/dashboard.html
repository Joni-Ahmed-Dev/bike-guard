<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BikeGuard · dashboard</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.css" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.js"></script>
<script src="config.js"></script>
<style>
  :root { --ink:#0b0f17; --card:#182032; --text:#eaf0f8; --muted:#8a97ab; --ember:#ff9f1c; --signal:#3ddbd9; --danger:#ff5a5f; }
  html,body { margin:0; background:var(--ink); color:var(--text); font-family:system-ui,-apple-system,"Segoe UI",sans-serif; }
  body { max-width:720px; margin:0 auto; padding:16px; }
  h1 { font-size:24px; margin:4px 0 2px; }
  .sub { color:var(--muted); font-size:14px; margin-bottom:16px; }
  #map { height:260px; border-radius:22px; overflow:hidden; }
  .card { background:var(--card); border:1px solid rgba(255,255,255,.13); border-radius:22px; padding:16px 18px; margin-top:12px; }
  .card h2 { font-size:16px; margin:0 0 8px; }
  .row { display:flex; gap:16px; flex-wrap:wrap; color:var(--muted); font-size:14px; }
  .row b { color:var(--text); font-size:18px; display:block; }
  #status { color:var(--signal); font-weight:600; }
  .ev { display:flex; justify-content:space-between; gap:12px; padding:8px 0; border-top:1px solid rgba(255,255,255,.08); font-size:14px; }
  .ev:first-of-type { border-top:0; }
  .ev span { color:var(--muted); white-space:nowrap; }
  .warn { color:var(--danger); }
  a { color:var(--ember); }
  .pin { width:18px; height:18px; border-radius:50%; background:var(--signal); border:3px solid #fff; box-shadow:0 0 0 8px rgba(61,219,217,.25); }
</style>
</head>
<body>
<h1>BikeGuard dashboard</h1>
<div class="sub"><span id="dev">BikeGuard</span> · <span id="status">…</span> · <a id="share" href="index.html">live share page</a></div>
<div id="map"></div>
<div class="card"><h2>Now</h2><div class="row">
  <div><b id="speed">–</b>speed</div>
  <div><b id="bat">–</b>battery</div>
  <div><b id="upd">–</b>updated</div>
  <div><b id="exp">–</b>link expires in</div>
</div></div>
<div class="card"><h2>Recent alerts</h2><div id="alerts">…</div></div>
<script>
const bn = (navigator.language || "").startsWith("bn");
const T = bn
  ? { live:"লাইভ", stale:"বিলম্বিত", gone:"এই লিংকের মেয়াদ শেষ বা বন্ধ করা হয়েছে", err:"সংযোগ সমস্যা…", none:"কোনো সতর্কতা নেই", ago:"আপডেট", s:"সে. আগে", m:"মি. আগে", min:"মি." }
  : { live:"Live", stale:"Delayed", gone:"This link has expired or was stopped", err:"Connection issue…", none:"No alerts", ago:"Updated", s:"s ago", m:"min ago", min:"min" };
const $ = (id) => document.getElementById(id);
const token = location.hash.slice(1);
$("share").href = "index.html#" + token;

async function rpc(fn) {
  const r = await fetch(`${BG.url}/rest/v1/rpc/${fn}`, {
    method: "POST",
    headers: { apikey: BG.key, Authorization: `Bearer ${BG.key}`, "Content-Type": "application/json" },
    body: JSON.stringify({ p_token: token }),
  });
  if (!r.ok) throw new Error(r.status);
  return r.json();
}

const map = new maplibregl.Map({ container: "map", style: "https://tiles.openfreemap.org/styles/bright", center: [90.4, 23.7], zoom: 5 });
const el = document.createElement("div"); el.className = "pin";
const marker = new maplibregl.Marker({ element: el });
let placed = false, ready = false;

map.on("load", () => {
  map.addSource("trail", { type: "geojson", data: { type: "FeatureCollection", features: [] } });
  map.addLayer({ id: "trail", type: "line", source: "trail", layout: { "line-cap": "round", "line-join": "round" },
                 paint: { "line-color": "#ff9f1c", "line-width": 4, "line-opacity": .85 } });
  ready = true; tick();
});

function ago(ms) {
  const age = Math.max(0, Math.round((Date.now() - ms) / 1000));
  return age < 90 ? `${age} ${T.s}` : `${Math.round(age / 60)} ${T.m}`;
}

async function tick() {
  if (!token || !ready) return;
  try {
    const [loc] = await rpc("shared_location");
    if (!loc) { $("dev").textContent = "BikeGuard"; $("status").textContent = T.gone; $("alerts").textContent = ""; return; }
    const ll = [loc.lng, loc.lat];
    marker.setLngLat(ll).addTo(map);
    if (!placed) { map.jumpTo({ center: ll, zoom: 16 }); placed = true; } else map.easeTo({ center: ll, duration: 800 });
    const age = Math.max(0, Math.round((Date.now() - new Date(loc.recorded_at)) / 1000));
    $("dev").textContent = loc.device_name;
    $("status").textContent = age < 240 ? T.live : T.stale;
    $("status").style.color = age < 240 ? "var(--signal)" : "var(--ember)";
    $("speed").textContent = `${Math.round((loc.speed || 0) * 3.6)} km/h`;
    $("bat").textContent = loc.battery != null ? `${loc.battery}%` : "–";
    $("upd").textContent = ago(new Date(loc.recorded_at));
    $("exp").textContent = `${Math.max(0, Math.round((new Date(loc.expires_at) - Date.now()) / 60000))} ${T.min}`;
    const trail = await rpc("shared_trail");
    map.getSource("trail").setData({ type: "Feature", geometry: { type: "LineString", coordinates: trail.map((p) => [p.lng, p.lat]) } });
    const alerts = await rpc("shared_alerts");
    $("alerts").innerHTML = alerts.length ? alerts.map((a) =>
      `<div class="ev"><span class="${a.severity === "critical" ? "warn" : ""}">${a.type}</span><span>${ago(new Date(a.created_at))}</span></div>`
    ).join("") : T.none;
  } catch (e) { $("status").textContent = T.err; }
}
setInterval(tick, 15000);
</script>
</body>
</html>
